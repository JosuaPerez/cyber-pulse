<style>
@font-face{font-family:Space;src:url('__SPACE_FONT__')}@font-face{font-family:Oswald;src:url('__OSWALD_FONT__')}*{box-sizing:border-box}body{margin:0;background:#202b3c;color:#f1f5f8;font-family:Space,sans-serif}nav{padding:15px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:13px}button{padding:12px;border:0;border-radius:8px;cursor:pointer}#stage{position:relative;width:540px;height:960px;margin:auto;overflow:hidden;padding:76px 38px 110px;background:radial-gradient(ellipse at 50% 45%,#183c48,#07131f 67%)}.brand{display:flex;align-items:center;gap:10px;font-size:21px;font-weight:bold}.brand svg{width:30px;color:#50dce4}.brand small{margin-left:auto;font-size:11px;letter-spacing:1px;color:#50dce4}.label{font-size:12px;color:#a8bfcd;letter-spacing:3px;margin-top:34px}h1{font-family:Oswald;font-size:46px;line-height:1.12;margin:18px 0 0;min-height:104px;color:#f4f6f8;letter-spacing:-.5px}.world{height:440px;position:relative;margin-top:12px;perspective:1000px}.phone{position:absolute;left:92px;top:28px;width:280px;height:370px;border:5px solid #536b7d;border-radius:34px;background:#0a1927;padding:30px 20px;box-shadow:0 30px 55px #0007}.notch{position:absolute;top:11px;left:101px;width:69px;height:7px;border-radius:7px;background:#77909e}.screen-title{font-size:17px;color:#b4cbd5;margin-bottom:28px}.bubble{padding:18px;background:#dff3f2;color:#17323d;border-radius:17px;font-size:22px;line-height:1.3}.link{color:#105e70;font-size:18px;margin-top:18px;text-decoration:underline;display:block}.cursor{position:absolute;left:253px;top:220px;width:42px;color:#ffda89;filter:drop-shadow(0 5px 5px #0006)}.pause{position:absolute;left:208px;top:284px;border:1px solid #ffda89;background:#352d1b;border-radius:30px;padding:8px 18px;color:#ffda89;font-size:17px}.floating{position:absolute;left:20px;right:20px;top:125px;background:#102d3c;border:1px solid #527c8b;border-radius:20px;padding:26px;font-size:24px;text-align:center;box-shadow:0 20px 60px #0008}.floating svg{height:76px;width:76px;color:#50dce4;display:block;margin:0 auto 18px}.float-detail{font-size:16px;line-height:1.4;color:#b4cbd5;margin-top:12px}.scan{position:absolute;left:54px;right:54px;height:3px;background:#50dce4;box-shadow:0 0 15px #50dce4;top:140px}.qr{width:86px!important;height:86px!important}.qr-label{font-size:12px;color:#b4cbd5}.channel{position:absolute;top:340px;left:45px;right:45px;background:#50dce4;color:#08202d;border-radius:12px;padding:15px;text-align:center;font-size:22px;font-weight:bold}.route{position:absolute;left:35px;right:35px;top:80px;display:flex;gap:15px;align-items:center}.route>div{flex:1;text-align:center;border:1px solid #365969;border-radius:18px;padding:20px 10px;background:#0d2432;font-size:18px}.route b{display:block;font-size:40px;margin-bottom:10px}.route span{color:#50dce4;font-size:30px}.check{position:absolute;top:240px;left:140px;width:180px;text-align:center;font-size:76px;color:#50dce4}.detail{font-size:22px;line-height:1.35;min-height:64px;border-left:3px solid #50dce4;padding-left:15px}.note{font-size:12px;color:#a4bdca;margin-top:12px;line-height:1.5}.footer{position:absolute;bottom:105px;left:38px;right:38px;display:flex;justify-content:space-between;border-top:1px solid #375567;padding-top:15px;font-size:12px;color:#b6cbd5}.progress{height:3px;position:absolute;top:0;left:0;background:#50dce4}.hidden{display:none}.save{position:absolute;top:250px;left:70px;right:70px;text-align:center;color:#50dce4;font-size:31px;font-weight:bold}

.phone{border-color:#4a7a88}.notch{background:#638f9b}.bubble{background:#153846;color:#edf7fa;border:1px solid #356c77;border-radius:16px;box-shadow:0 7px 20px #0002}.link{color:#65e4eb;font-family:inherit}.cursor{width:28px;color:#50dce4;left:0;top:0;pointer-events:none}.note{font-size:13px;color:#d0e6ed;line-height:1.55;margin-top:16px;border-left:2px solid #497580;background:#102a36;padding:10px 12px}.footer{font-size:11px;color:#88a6b7;border-color:#294451}.floating svg{transform-origin:center}.route>div{will-change:transform,opacity}.scan{left:calc(50% - 47px);right:auto;width:94px}.caption-source{color:#d0e6ed}
</style>
<nav><button id="play">Reproducir / pausar</button><button id="restart">Inicio</button><input id="seek" type="range" min="0" max="29" value="0" step=".01" aria-label="Tiempo"><span id="mode"></span></nav><audio id="audio"></audio>
<main id="stage"><div class="progress" id="progress"></div><header class="brand"><svg viewBox="0 0 60 45"><path d="M1 24h13l8-18 13 34 9-19h15" fill="none" stroke="currentColor" stroke-width="4"/></svg>CyberPulse<small>MITO VS. MECANISMO</small></header><div class="label" id="label">EDUCACIÓN · SIN ALARMISMO</div><h1 id="headline"></h1><section class="world"><div class="phone" id="phone"><div class="notch"></div><div class="screen-title" id="screen-title">Mensajes</div><div class="bubble"><span id="message">Confirma tus datos para continuar.</span><span class="link" id="link">Revisar solicitud →</span></div></div><svg id="cursor" class="cursor" viewBox="0 0 50 60"><path d="M5 2v45l12-12 10 21 10-5-10-20 17-1Z" fill="currentColor" stroke="#10222f" stroke-width="3"/></svg><div class="floating hidden" id="floating"><svg id="icon" viewBox="0 0 100 100"></svg><span id="float-title"></span><div class="float-detail" id="float-detail"></div></div><div class="scan hidden" id="scan"></div><div class="channel hidden" id="channel">Abre la app por tu cuenta</div><div class="route hidden" id="route"><div><b>✉</b>Petición recibida</div><span>→</span><div><b>▤</b>App oficial</div></div><div class="check hidden" id="check">✓</div><div class="save hidden" id="save">GUÁRDALO</div></section><div class="detail" id="detail"></div><div class="note">Ejemplos ficticios · no es una campaña actual.<br>Fuentes: FTC y NIST · referencias en el caption.</div><footer class="footer"><span>@cyberpulse89</span><span id="footer-mode"></span></footer></main>
<script>
const data=__REEL_DATA__,scenes=data.scenes,total=scenes.reduce((sum,s)=>sum+s.duration,0);const $=id=>document.getElementById(id);const clamp=x=>Math.max(0,Math.min(x,1));const ease=x=>1-Math.pow(1-clamp(x),3);const show=(id,on)=>$(id).classList.toggle('hidden',!on);const txt=(id,value)=>$(id).textContent=value;let playing=false,start=0;
const icons={attachment:'<path d="M25 8h35l20 20v62H25Z M60 8v22h20 M38 48h29 M38 61h29 M38 74h20" stroke="currentColor" stroke-width="5" fill="none"/>',call:'<path d="M30 15 15 30c-3 22 33 58 55 55l15-15-19-16-12 10c-10-4-14-8-18-18l10-12Z" fill="none" stroke="currentColor" stroke-width="5"/>',qr:'<path d="M10 10h30v30H10ZM60 10h30v30H60ZM10 60h30v30H10Z" fill="none" stroke="currentColor" stroke-width="7"/><path d="M60 60h10v10H60ZM80 80h10v10H80ZM60 80h10v10H60Z" fill="currentColor"/>'};
txt('mode',data.audio?'Vista con voz sintética · revisar locución':'Animatic sin voz · tiempos provisionales');txt('footer-mode',data.audio?'VOZ SINTÉTICA · BORRADOR':'SIN VOZ · BORRADOR');$('seek').max=total;if(data.audio)$('audio').src=data.audio;
window.renderAt=function(value){
 const t=Math.max(0,Math.min(value,total-.0001));let base=0,i=0;
 for(let n=0;n<scenes.length;n++){if(t<base+scenes[n].duration){i=n;break}base+=scenes[n].duration}
 const s=scenes[i],local=t-base,p=local/s.duration,entry=ease(local/.65),wave=Math.sin(local*Math.PI*2/2.6);
 txt('headline',s.headline);txt('detail',s.detail);$('headline').style.transform=`translateY(${9*(1-entry)}px)`;$('headline').style.opacity=.45+.55*entry;
 $('progress').style.width=100*t/total+'%';$('seek').value=t;
 const message=s.view==='hook'||s.view==='link',other=['attachment','call','qr'].includes(s.view),verify=s.view==='verify',cta=s.view==='cta';
 show('phone',message||verify);show('cursor',message);show('floating',other);show('scan',s.view==='qr');show('channel',verify);show('route',cta);show('check',verify);show('save',cta);
 $('phone').style.transform=`translate(${verify?25*(1-entry):0}px,${-3*wave}px) rotateY(${message?-4+4*entry:0}deg) scale(${(verify?.86:1)+.012*p})`;
 $('phone').style.opacity=verify?1-.65*ease((p-.5)*2):.65+.35*entry;
 txt('screen-title',verify?'App oficial':'Mensajes');txt('message',verify?'Revisa aquí tu cuenta o tu pedido.':'Confirma tus datos para continuar.');txt('link',verify?'Acceso independiente ✓':'Revisar solicitud →');
 if(message){const target=$('link').getBoundingClientRect(),world=document.querySelector('.world').getBoundingClientRect();$('cursor').style.left=(target.right-world.left-25)+'px';$('cursor').style.top=(target.bottom-world.top+15+3*wave)+'px';$('cursor').style.transform=`rotate(${-8+3*wave}deg)`;}
 if(other){
  $('icon').innerHTML=icons[s.view];$('icon').classList.toggle('qr',s.view==='qr');
  txt('float-title',s.view==='attachment'?'Documento inesperado':s.view==='call'?'«Dime tus datos»':'QR → web que pide datos');
  txt('float-detail',s.view==='attachment'?'No abras adjuntos sin verificar la petición.':s.view==='call'?'Confirma por un contacto que ya conozcas.':'Esquema ilustrativo · no escaneable');
  $('floating').style.transform=`translateY(${35*(1-entry)-3*wave}px) rotate(${(1-entry)*-3}deg) scale(${1+.014*p})`;$('floating').style.opacity=.4+.6*entry;
  const rotation=s.view==='call'?5*Math.sin(local*8):s.view==='attachment'?2.5*wave:0;
  $('icon').style.transform=`rotate(${rotation}deg) scale(${1+.04*Math.sin(local*3)})`;
 }
 if(s.view==='qr'){const icon=$('icon').getBoundingClientRect(),world=document.querySelector('.world').getBoundingClientRect();$('scan').style.top=(icon.top-world.top+icon.height*(.5+.32*Math.sin(local*3)))+'px';}
 $('scan').style.opacity=entry*.6;
 $('channel').style.transform=`translateY(${20*(1-entry)-2*wave}px)`;$('channel').style.opacity=entry;
 $('check').style.opacity=ease((p-.55)*4);$('check').style.transform=`scale(${.7+.3*ease((p-.55)*4)+.025*wave})`;
 $('route').style.transform=`translateY(${-3*wave}px)`;
 Array.from($('route').querySelectorAll('div')).forEach((node,n)=>{const arrival=ease((local-n*.35)/.65);node.style.opacity=.4+.6*arrival;node.style.transform=`translateY(${18*(1-arrival)}px)`});
 $('save').style.opacity=entry;$('save').style.transform=`translateY(${20*(1-entry)}px) scale(${1+.012*wave})`;
};
function tick(now){if(!playing)return;const t=data.audio?$('audio').currentTime:(now-start)/1000;renderAt(t);if(t<total&&(!$('audio').ended||!data.audio))requestAnimationFrame(tick);else playing=false}
$('play').onclick=async()=>{playing=!playing;if(playing){if(data.audio)await $('audio').play();start=performance.now()-Number($('seek').value)*1000;requestAnimationFrame(tick)}else $('audio').pause()};$('restart').onclick=()=>{playing=false;$('audio').pause();$('audio').currentTime=0;renderAt(0)};$('seek').oninput=e=>{playing=false;$('audio').pause();if(data.audio)$('audio').currentTime=Number(e.target.value);renderAt(Number(e.target.value))};renderAt(0);
</script></html>
