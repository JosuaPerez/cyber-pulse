<style>
@font-face{font-family:Space;src:url('__SPACE_FONT__')}@font-face{font-family:Oswald;src:url('__OSWALD_FONT__')}
*{box-sizing:border-box}body{margin:0;background:#202b3c;color:#f1f5f8;font-family:Space,Arial,sans-serif}

.file-label{position:absolute;left:40px;right:40px;bottom:24px;text-align:center;font-size:44px;color:#b4cbd5}

.qr-box{position:absolute;left:286px;top:80px;width:380px;height:330px;padding:30px;border:2px solid #4a7a88;border-radius:24px;color:#50dce4}.qr-box svg{width:100%;height:100%}.scan{position:absolute;left:20px;right:20px;height:5px;background:#50dce4}
.url{position:absolute;top:435px;left:30px;right:30px;padding:18px;text-align:center;border:2px solid #50dce4;border-radius:16px;background:#102d3c;font-size:44px;line-height:1.3}.qr-note{position:absolute;left:0;right:0;bottom:0;text-align:center;font-size:44px;color:#b4cbd5}
.check{position:absolute;right:18px;bottom:12px;background:#102d3c;border:3px solid #50dce4;border-radius:50%;width:140px;height:140px;display:grid;place-items:center;font-size:98px;color:#50dce4}
.detail{font-size:44px;line-height:1.25;min-height:112px;border-left:4px solid #50dce4;padding-left:24px;flex-shrink:0}
.bookmark{position:absolute;left:406px;top:0;width:140px;height:155px;color:#50dce4}.bookmark svg{width:100%;height:100%}
.options{position:absolute;left:0;right:0;top:195px;text-align:center;font-size:48px;color:#50dce4;line-height:1.3}
.question{position:absolute;left:15px;right:15px;top:290px;background:#173c49;border:2px solid #4a7a88;border-radius:32px;padding:24px 30px;font-size:48px;line-height:1.25;text-align:center;text-wrap:balance}
.follow{position:absolute;left:0;right:0;top:530px;text-align:center;font-size:44px;line-height:1.3;color:#b4cbd5}
.footer{height:60px;display:flex;justify-content:space-between;border-top:1px solid #375567;padding:9px 0 12px;font-size:26px;line-height:1.15;color:#b6cbd5;flex-shrink:0}
.progress{position:absolute;left:0;bottom:0;height:3px;background:#50dce4}.hidden{display:none!important}
.loop-layer{position:absolute;inset:0;pointer-events:none;background:#091725;opacity:0}
.cover{position:absolute;left:72px;right:72px;top:var(--safe-top);height:calc(var(--safe-bottom) - var(--safe-top));display:flex;flex-direction:column;justify-content:center;text-align:center;gap:36px}
.cover h1{font-size:112px;line-height:1.1;min-height:0;padding-bottom:24px}.cover .eyebrow{font-size:32px;letter-spacing:4px;color:#50dce4}.cover .handle{font-size:38px;color:#b4cbd5}
</style>
<nav><button id="play">Reproducir / pausar</button><button id="restart">Inicio</button><input id="seek" type="range" min="0" value="0" step=".01" aria-label="Tiempo"></nav><audio id="audio"></audio>
<main id="stage"><div class="scene-bg" id="scene-bg"></div><section id="safe" class="safe">
<header class="brand" data-safe><svg viewBox="0 0 60 45"><path d="M1 24h13l8-18 13 34 9-19h15" fill="none" stroke="currentColor" stroke-width="4"/></svg>CyberPulse<small>MITO VS. MECANISMO</small></header>
<div id="main" class="main"><h1 id="headline" data-safe></h1><section class="world" id="world">
<div class="visual" id="phone-visual"><div class="phone" id="phone" data-safe><div class="screen-title" id="screen-title"></div><div class="bubble"><span id="message"></span><span class="link" id="link"></span></div><div class="fiction">Ejemplo ficticio</div></div>
<svg id="cursor" class="cursor" viewBox="0 0 50 60"><path d="M5 2v45l12-12 10 21 10-5-10-20 17-1Z" fill="currentColor" stroke="#10222f" stroke-width="3"/></svg><div class="check hidden" id="check" data-safe>✓</div></div>
<div class="visual hidden" id="attachment"><div class="document" id="document"><svg viewBox="0 0 100 120"><path d="M15 5h45l25 25v85H15Z M60 5v28h25 M28 53h45 M28 70h40 M28 87h30" stroke="currentColor" stroke-width="4" fill="#0c2230"/></svg></div><div class="permission" id="permission" data-safe><span id="permission-label"></span><strong id="permission-text"></strong><b>Verifica antes de permitir</b></div><div class="file-label" id="filename" data-safe></div></div>
<div class="visual hidden" id="call"><div class="ring" id="ring-a"></div><div class="ring" id="ring-b"></div><div class="call-icon" id="call-icon"><svg viewBox="0 0 100 100"><path d="M30 15 15 30c-3 22 33 58 55 55l15-15-19-16-12 10c-10-4-14-8-18-18l10-12Z" fill="none" stroke="currentColor" stroke-width="5"/></svg></div><div class="speech" id="speech" data-safe></div></div>
<div class="visual hidden" id="qr"><div class="qr-box" id="qr-box"><svg viewBox="0 0 100 100"><path d="M10 10h30v30H10ZM60 10h30v30H60ZM10 60h30v30H10Z" fill="none" stroke="currentColor" stroke-width="7"/><path d="M60 60h10v10H60ZM80 80h10v10H80Z" fill="currentColor"/></svg><div class="scan" id="scan"></div></div><div class="url" id="url" data-safe></div><div class="qr-note" id="qr-note" data-safe></div></div>
<div class="visual hidden" id="cta"><div class="bookmark" id="bookmark"><svg viewBox="0 0 100 115"><path d="M20 5h60v102L50 85l-30 22Z" stroke="currentColor" stroke-width="5" fill="#173c49"/></svg></div><div class="options" id="options" data-safe></div><div class="question" id="question" data-safe></div><div class="follow" id="follow" data-safe></div></div>
<div class="trap-tag hidden" id="trap-tag" data-safe></div><div class="trap-progress hidden" id="trap-progress" data-safe></div>
</section><div class="detail" id="detail" data-safe></div></div>
<footer class="footer" data-safe><span>@cyberpulse89</span><span id="draft" class="hidden">BORRADOR</span></footer><div class="progress" id="progress"></div>
</section><section class="loop-layer" id="loop-layer"></section><section class="cover hidden" id="cover"><div class="eyebrow" data-cover-safe>MITO VS. MECANISMO</div><h1 id="cover-title" data-cover-safe></h1><div class="handle" data-cover-safe>@cyberpulse89</div></section></main>
<script>
const data=__REEL_DATA__,scenes=data.scenes,total=scenes.reduce((sum,s)=>sum+s.duration,0);
const $=id=>document.getElementById(id),clamp=x=>Math.max(0,Math.min(x,1)),ease=x=>1-Math.pow(1-clamp(x),3),show=(id,on)=>$(id).classList.toggle('hidden',!on),txt=(id,v)=>$(id).textContent=v;
let playing=false,start=0;
const layout=data.layout;$('stage').style.setProperty('--safe-top',layout.top+'px');$('stage').style.setProperty('--safe-bottom',layout.bottom+'px');show('draft',layout.draft);if(!layout.draft)$('draft').remove();$('seek').max=total;if(data.audio)$('audio').src=data.audio;
window.renderAt=function(value){
 show('cover',false);show('safe',true);
 const t=Math.max(0,Math.min(value,total));let base=0,i=0;
 for(let n=0;n<scenes.length;n++){i=n;if(t<base+scenes[n].duration||n===scenes.length-1)break;base+=scenes[n].duration}
 const s=scenes[i],local=t-base,p=clamp(local/s.duration),entry=ease(local/.25),wave=Math.sin(local*Math.PI*2/1.2),trap=!!s.trap_number,verify=s.view==='verify';
 txt('headline',trap?'Trampa '+s.trap_number+': '+s.headline:s.headline);txt('detail',s.view==='cta'?'':s.detail);
 $('headline').style.transform='translateY('+(12*(1-entry))+'px)';$('headline').style.opacity=.7+.3*entry;
 $('detail').style.opacity=s.view==='cta'?0:verify?ease((local-1.6)/.25):entry;
 $('scene-bg').style.transform='scale('+(1+.04*p)+')';
 $('progress').style.width=(100*t/total)+'%';$('seek').value=t;
 for(const view of ['attachment','call','qr','cta'])show(view,s.view===view);
 show('phone-visual',s.view==='hook'||verify);show('cursor',s.view==='hook');show('check',verify);
 show('trap-tag',trap);show('trap-progress',trap);txt('trap-tag',trap?s.trap_number+' · '+s.visual_title:'');txt('trap-progress',trap?s.trap_number+'/'+s.trap_total:'');
 txt('screen-title',s.phone_title||'');txt('message',s.message||'');txt('link',s.link||'');
 $('phone').style.transform='translateY('+(18*(1-entry)+3*wave)+'px)';
 $('phone').style.opacity=verify?ease(local/.25):entry*.2+.8;
 if(s.view==='hook'){const r=$('link').getBoundingClientRect(),w=$('world').getBoundingClientRect();$('cursor').style.left=(r.right-w.left-40)+'px';$('cursor').style.top=(r.bottom-w.top+18+4*wave)+'px';$('cursor').style.transform='rotate('+(-8+3*wave)+'deg)';}
 if(s.view==='attachment'){txt('filename',s.filename);txt('permission-label',s.visual_detail);txt('permission-text',s.permission);$('document').style.transform='translateY('+(18*(1-entry)+4*wave)+'px) rotateY('+(-32*ease((local-.5)/.7))+'deg) rotate('+(-3*wave)+'deg)';const open=ease((local-.7)/.25);$('permission').style.opacity=open;$('permission').style.transform='translateX('+(30*(1-open))+'px) scale('+(1+.01*wave)+')';}
 if(s.view==='call'){txt('speech',s.visual_title);$('call-icon').style.transform='translateY('+(20*(1-entry))+'px) rotate('+(7*wave)+'deg)';for(const [n,id] of ['ring-a','ring-b'].entries()){const pulse=(local*.9+n*.5)%1;$(id).style.transform='scale('+(1+pulse*.8)+')';$(id).style.opacity=(1-pulse)*.5;}$('speech').style.opacity=ease((local-.45)/.25);$('speech').style.transform='translateY('+(18*(1-entry)+3*wave)+'px)';}
 if(s.view==='qr'){txt('url',s.example_url);txt('qr-note',s.visual_detail);$('qr-box').style.transform='translateY('+(16*(1-entry)+3*wave)+'px)';$('scan').style.top=(20+250*(.5+.45*Math.sin(local*4)))+'px';const urlEntry=ease((local-1.1)/.25);$('url').style.opacity=urlEntry;$('url').style.transform='translateY('+(20*(1-urlEntry))+'px)';}
 const checkEntry=ease((local-.85)/.25);$('check').style.opacity=checkEntry;$('check').style.transform='scale('+(.6+.4*checkEntry+.025*wave)+')';
 if(s.view==='cta'){txt('options',s.options);txt('question',s.question);txt('follow',s.follow);$('bookmark').style.transform='translateY('+(30*(1-entry))+'px) scale('+(.7+.3*entry+.025*wave)+')';$('question').style.opacity=ease((local-.35)/.25);$('question').style.transform='translateY('+(18*(1-entry)+3*wave)+'px)';$('follow').style.opacity=ease((local-.8)/.25);}
 $('loop-layer').style.opacity=ease((t-(total-.18))/.18);
};
window.renderCover=function(){show('safe',false);$('loop-layer').style.opacity=0;show('cover',true);$('scene-bg').style.transform='scale(1)';txt('cover-title',scenes[0].headline);};
function tick(now){if(!playing)return;const t=data.audio?$('audio').currentTime:(now-start)/1000;renderAt(t);if(t<total)requestAnimationFrame(tick);else playing=false;}
$('play').onclick=async()=>{playing=!playing;if(playing){if(data.audio)await $('audio').play();start=performance.now()-Number($('seek').value)*1000;requestAnimationFrame(tick);}else $('audio').pause();};
$('restart').onclick=()=>{playing=false;$('audio').pause();$('audio').currentTime=0;renderAt(0);};$('seek').oninput=e=>{playing=false;$('audio').pause();if(data.audio)$('audio').currentTime=Number(e.target.value);renderAt(Number(e.target.value));};
window.prepareLoop=function(){renderAt(0);$('loop-layer').replaceChildren();for(const source of [$('scene-bg'),$('safe')]){const clone=source.cloneNode(true);clone.removeAttribute('id');for(const el of clone.querySelectorAll('[id]'))el.removeAttribute('id');for(const el of clone.querySelectorAll('[data-safe]'))el.removeAttribute('data-safe');$('loop-layer').appendChild(clone);}};
renderAt(0);document.fonts.ready.then(window.prepareLoop);
</script></html>
