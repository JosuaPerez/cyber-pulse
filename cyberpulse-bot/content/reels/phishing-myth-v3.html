<!doctype html>
<html lang="es"><meta charset="utf-8"><title>CyberPulse · Mito vs. mecanismo</title>
<style>
@font-face{font-family:Space;src:url('__SPACE_FONT__')}@font-face{font-family:Oswald;src:url('__OSWALD_FONT__')}
*{box-sizing:border-box}body{margin:0;background:#202b3c;color:#f1f5f8;font-family:Space,Arial,sans-serif}
nav{padding:16px;display:flex;gap:16px}button{padding:12px}#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:#091725}
#safe{position:absolute;left:72px;right:72px;top:var(--safe-top);height:calc(var(--safe-bottom) - var(--safe-top));display:flex;flex-direction:column;gap:16px}
.brand{display:flex;align-items:center;gap:16px;font-size:32px;font-weight:bold;height:45px;flex-shrink:0}.brand svg{width:46px;height:40px;color:#50dce4}.brand small{margin-left:auto;font-size:22px;letter-spacing:3px;color:#50dce4}
h1{font-family:Oswald,Arial,sans-serif;font-size:76px;line-height:1.16;margin:12px 0 0;min-height:196px;padding-bottom:16px;flex-shrink:0;max-width:920px}
.world{height:520px;position:relative;flex-shrink:0}.phone{position:absolute;left:200px;top:20px;width:536px;height:468px;border:5px solid #4a7a88;border-radius:40px;background:#0c2230;padding:36px;transform-origin:center}
.screen-title{font-size:27px;color:#b4cbd5;margin-bottom:25px}.bubble{padding:28px;border:2px solid #356c77;background:#153846;border-radius:22px;font-size:36px;line-height:1.3}.link{display:block;color:#65e4eb;text-decoration:underline;font-size:29px;margin-top:20px}.fiction{font-size:23px;color:#b7d2db;margin-top:24px}
.cursor{position:absolute;width:40px;height:52px;color:#50dce4;pointer-events:none}.floating{position:absolute;inset:40px 45px 0;border:2px solid #365e70;border-radius:24px;background:#102d3c;padding:35px;text-align:center;font-size:38px;height:420px}.floating svg{width:130px;height:130px;color:#50dce4;display:block;margin:0 auto 24px}.float-detail{font-size:28px;color:#b9d3df;line-height:1.3;margin-top:20px}.scan{position:absolute;left:calc(50% - 70px);width:140px;height:3px;background:#50dce4;pointer-events:none}
.check{position:absolute;right:65px;bottom:40px;background:#102d3c;border:3px solid #50dce4;border-radius:50%;width:125px;height:125px;display:grid;place-items:center;font-size:85px;color:#50dce4}.save{position:absolute;top:120px;left:45px;right:45px;text-align:center;color:#50dce4;font-size:44px;line-height:1.8;font-weight:bold}
.detail{font-size:36px;line-height:1.3;border-left:4px solid #50dce4;padding-left:24px;min-height:94px;flex-shrink:0}.footer{margin-top:auto;display:flex;justify-content:space-between;border-top:1px solid #375567;padding-top:16px;padding-bottom:12px;font-size:25px;color:#b6cbd5}.progress{position:absolute;left:0;bottom:0;height:3px;background:#50dce4}.hidden{display:none!important}
</style>
<nav><button id="play">Reproducir / pausar</button><button id="restart">Inicio</button><input id="seek" type="range" min="0" value="0" step=".01" aria-label="Tiempo"></nav><audio id="audio"></audio>
<main id="stage"><section id="safe">
<header class="brand" data-safe><svg viewBox="0 0 60 45"><path d="M1 24h13l8-18 13 34 9-19h15" fill="none" stroke="currentColor" stroke-width="4"/></svg>CyberPulse<small>MITO VS. MECANISMO</small></header>
<h1 id="headline" data-safe></h1>
<section class="world" id="world">
<div class="phone" id="phone" data-safe><div class="screen-title" id="screen-title">1 · SMS</div><div class="bubble"><span id="message"></span><span class="link" id="link"></span></div><div class="fiction">Ejemplo ficticio</div></div>
<svg id="cursor" class="cursor" viewBox="0 0 50 60"><path d="M5 2v45l12-12 10 21 10-5-10-20 17-1Z" fill="currentColor" stroke="#10222f" stroke-width="3"/></svg>
<div class="floating hidden" id="floating" data-safe><svg id="icon" viewBox="0 0 100 100"></svg><span id="float-title"></span><div class="float-detail" id="float-detail"></div></div>
<div class="scan hidden" id="scan"></div><div class="check hidden" id="check" data-safe>✓</div><div class="save hidden" id="save" data-safe></div>
</section>
<div class="detail" id="detail" data-safe></div>
<footer class="footer" data-safe><span>@cyberpulse89</span><span id="draft" class="hidden">BORRADOR</span></footer>
<div class="progress" id="progress"></div>
</section></main>
<script>
const data=__REEL_DATA__,scenes=data.scenes,total=scenes.reduce((sum,s)=>sum+s.duration,0);
const $=id=>document.getElementById(id),clamp=x=>Math.max(0,Math.min(x,1)),ease=x=>1-Math.pow(1-clamp(x),3),show=(id,on)=>$(id).classList.toggle('hidden',!on),txt=(id,v)=>$(id).textContent=v;
let playing=false,start=0;
const layout=data.layout;$('stage').style.setProperty('--safe-top',layout.top+'px');$('stage').style.setProperty('--safe-bottom',layout.bottom+'px');show('draft',layout.draft);if(!layout.draft)$('draft').remove();$('seek').max=total;if(data.audio)$('audio').src=data.audio;
const icons={attachment:'<path d="M25 8h35l20 20v62H25Z M60 8v22h20 M38 48h29 M38 61h29 M38 74h20" stroke="currentColor" stroke-width="5" fill="none"/>',call:'<path d="M30 15 15 30c-3 22 33 58 55 55l15-15-19-16-12 10c-10-4-14-8-18-18l10-12Z" fill="none" stroke="currentColor" stroke-width="5"/>',qr:'<path d="M10 10h30v30H10ZM60 10h30v30H60ZM10 60h30v30H10Z" fill="none" stroke="currentColor" stroke-width="7"/><path d="M60 60h10v10H60ZM80 80h10v10H80Z" fill="currentColor"/>'};
window.renderAt=function(value){
 const t=Math.max(0,Math.min(value,total));let base=0,i=0;
 for(let n=0;n<scenes.length;n++){i=n;if(t<base+scenes[n].duration||n===scenes.length-1)break;base+=scenes[n].duration}
 let s=scenes[i],local=t-base;
 // Últimos 0.18s: vuelve al estado inicial para cerrar el bucle.
 const loop=i===scenes.length-1&&total-t<=.18;
 if(loop){s=scenes[0];local=0;}
 const entry=ease(local/.18),wave=Math.sin(local*Math.PI*2/1.2),other=['attachment','call','qr'].includes(s.view),verify=s.view==='verify',cta=s.view==='cta';
 txt('headline',s.headline);txt('detail',s.detail);$('headline').style.transform=`translateY(${8*(1-entry)}px)`;$('headline').style.opacity=.85+.15*entry;
 $('progress').style.width=(loop?0:100*t/total)+'%';$('seek').value=t;
 show('phone',!other&&!cta);show('cursor',s.view==='hook');show('floating',other);show('scan',s.view==='qr');show('check',verify);show('save',cta);txt('save',s.options||'');
 $('phone').style.transform=`translateY(${8*(1-entry)+3*wave}px)`;
 txt('screen-title',s.phone_title||'');txt('message',s.message||'');txt('link',s.link||'');
 if(s.view==='hook'){const target=$('link').getBoundingClientRect(),world=$('world').getBoundingClientRect();$('cursor').style.left=(target.right-world.left-40)+'px';$('cursor').style.top=(target.bottom-world.top+16+3*wave)+'px';$('cursor').style.transform=`rotate(${-8+3*wave}deg)`;}
 if(other){$('icon').innerHTML=icons[s.view];txt('float-title',s.visual_title);txt('float-detail',s.visual_detail);$('floating').style.transform=`translateY(${12*(1-entry)+4*wave}px)`;$('floating').style.opacity=.85+.15*entry;$('icon').style.transform=`rotate(${s.view==='call'?4*wave:0}deg) scale(${1+.025*wave})`;}
 if(s.view==='qr'){const r=$('icon').getBoundingClientRect(),w=$('world').getBoundingClientRect();$('scan').style.top=(r.top-w.top+r.height*(.5+.35*wave))+'px';}
 $('check').style.transform=`scale(${.88+.12*entry+.025*wave})`;$('save').style.transform=`translateY(${2*wave}px)`;
};
function tick(now){if(!playing)return;const t=data.audio?$('audio').currentTime:(now-start)/1000;renderAt(t);if(t<total)requestAnimationFrame(tick);else playing=false;}
$('play').onclick=async()=>{playing=!playing;if(playing){if(data.audio)await $('audio').play();start=performance.now()-Number($('seek').value)*1000;requestAnimationFrame(tick);}else $('audio').pause();};
$('restart').onclick=()=>{playing=false;$('audio').pause();$('audio').currentTime=0;renderAt(0);};$('seek').oninput=e=>{playing=false;$('audio').pause();if(data.audio)$('audio').currentTime=Number(e.target.value);renderAt(Number(e.target.value));};renderAt(0);
</script></html>
