<!doctype html>
<html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CyberPulse Lab · historial Git</title>
<style>
@font-face{font-family:Space;src:url('__SPACE_FONT__')}@font-face{font-family:Oswald;src:url('__OSWALD_FONT__')}
*{box-sizing:border-box}body{margin:0;background:#1b2637;color:#f2f6fa;font-family:Space,Arial,sans-serif}nav{padding:15px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:14px}button{border:0;border-radius:7px;padding:12px 16px;cursor:pointer}#stage{width:540px;height:960px;background:#081522;position:relative;padding:78px 38px 110px;overflow:hidden;margin:auto;background-image:linear-gradient(#50dce406 1px,transparent 1px),linear-gradient(90deg,#50dce406 1px,transparent 1px);background-size:30px 30px}.brand{display:flex;align-items:center;gap:10px;font-size:21px;font-weight:bold}.brand svg{width:30px;color:#50dce4}.brand span:last-child{font-size:12px;margin-left:auto;letter-spacing:2px;color:#50dce4}.line{height:3px;background:#24394c;margin-top:23px}.progress{height:3px;background:#50dce4;width:0}.label{font-size:13px;letter-spacing:2px;color:#a6bdcd;margin:29px 0 15px}h1{font-family:Oswald,sans-serif;font-size:51px;line-height:1.1;margin:0;letter-spacing:-1px}h1 span{display:block;color:#50dce4;margin-top:7px}.terminal{border:1px solid #365369;border-radius:16px;overflow:hidden;background:#060e17;margin-top:28px;min-height:285px}.terminal header{padding:14px 18px;background:#132a3b;color:#c6d8e3;font-size:13px;display:flex;justify-content:space-between}.terminal header b{color:#50dce4;font-weight:normal}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:17px/1.6 Consolas,monospace;margin:0;padding:22px 19px;color:#d9e8ee;min-height:225px}.command{color:#50dce4}.secret{background:#614d1e;color:#ffdb87;display:inline-block}.takeaway{border-left:3px solid #50dce4;padding:10px 0 10px 16px;font-size:23px;line-height:1.3;margin-top:26px}.disclaimer{font-size:13px;line-height:1.5;color:#9bb1c0;margin-top:17px}.subtitle{font-size:13px;line-height:1.45;color:#9bb1c0;margin-top:14px}.footer{position:absolute;left:38px;right:38px;bottom:100px;display:flex;justify-content:space-between;border-top:1px solid #375366;padding-top:16px;font-size:13px;color:#bed0dd}.remedy{padding:22px;font-size:21px;line-height:1.35}.remedy>div{padding:16px 0;border-bottom:1px solid #375366}.remedy>div:last-child{border:0}.remedy b{color:#50dce4}.review{color:#ffdb87} @media(max-width:550px){#stage{transform-origin:top left;zoom:.7}}
.subtitle{display:none}.comparison pre{padding:14px 19px;min-height:0;font-size:14px;line-height:1.45}.comparison pre+pre{border-top:1px solid #365369}
</style>
<nav><button id="play">Reproducir · 27 s</button><button id="restart">Inicio</button><input id="seek" type="range" min="0" max="27" step="0.1" value="0" aria-label="Momento del borrador"><span>Borrador sin voz · texto de apoyo, no subtítulos sincronizados</span></nav>
<main id="stage"><div class="brand"><svg viewBox="0 0 60 45"><path d="M1 24h13l8-18 13 34 9-19h15" fill="none" stroke="currentColor" stroke-width="4"/></svg>CyberPulse<span>LAB / 001</span></div><div class="line"><div class="progress" id="progress"></div></div><div class="label" id="label"></div><h1><span id="title" style="color:#f2f6fa"></span><span id="accent"></span></h1><section class="terminal"><header><span id="terminal-label"></span><b>LOCAL · DEMO</b></header><div id="console"></div></section><div class="takeaway" id="takeaway"></div><div class="disclaimer">Laboratorio propio · credencial ficticia sin acceso a servicios.<br>No demuestra que se haya producido una filtración real.</div><div class="subtitle" id="narration"></div><footer class="footer"><span>@cyberpulse89</span><span id="counter"></span></footer></main>
<script>
const data=__LAB_DATA__;const total=data.script.scenes.reduce((sum,s)=>sum+s.duration,0);let playing=false,start=0;
function text(id,value){document.getElementById(id).textContent=value}
function terminal(view){
 const el=document.getElementById('console');el.replaceChildren();el.className=view==='comparison'?'comparison':'';
 if(view==='comparison')text('terminal-label','app.ini · dos revisiones');
 if(['comparison','current','previous'].includes(view)){
  const views=view==='comparison'?['current','previous']:[view];
  for(const selected of views){
   const pre=document.createElement('pre'),command=document.createElement('span');command.className='command';
   command.textContent=selected==='current'?'$ git show HEAD:app.ini\n\n':'$ git show HEAD~1:app.ini\n\n';pre.append(command);
   const output=selected==='current'?data.evidence.current:data.evidence.previous;
   const parts=output.split(data.evidence.dummy);parts.forEach((part,i)=>{pre.append(document.createTextNode(part));if(i<parts.length-1){const mark=document.createElement('span');mark.className='secret';mark.textContent=data.evidence.dummy;pre.append(mark)}});el.append(pre);
  }
 }else{
  const box=document.createElement('div');box.className='remedy';const items=view==='remediation'?['1 / Revoca o rota la clave expuesta.','2 / Evalúa historial y copias con tu equipo.']:['Revisa el diff antes del commit.','Usa variables de entorno o un gestor de secretos.'];
  for(const item of items){const row=document.createElement('div');row.textContent=item;box.append(row)}el.append(box);
 }
}
window.renderAt=function(value){const t=Math.max(0,Math.min(value,total-.001));let at=0,index=0;for(let i=0;i<data.script.scenes.length;i++){if(t<at+data.script.scenes[i].duration){index=i;break}at+=data.script.scenes[i].duration}const scene=data.script.scenes[index];text('label',scene.label);text('title',scene.title);text('accent',scene.accent);text('takeaway',scene.takeaway);text('narration',scene.narration);text('terminal-label',scene.view==='current'?'app.ini · versión actual':scene.view==='previous'?'app.ini · commit anterior':'PRÓXIMO PASO');text('counter',`${index+1} / ${data.script.scenes.length} · SIN VOZ`);terminal(scene.view);document.getElementById('progress').style.width=(100*t/total)+'%';document.getElementById('seek').value=t};
document.getElementById('play').onclick=()=>{playing=!playing;if(playing){start=performance.now()-Number(document.getElementById('seek').value)*1000;requestAnimationFrame(tick)}};function tick(now){if(!playing)return;const t=(now-start)/1000;renderAt(t);if(t<total)requestAnimationFrame(tick);else playing=false}document.getElementById('restart').onclick=()=>{playing=false;renderAt(0)};document.getElementById('seek').oninput=e=>{playing=false;renderAt(Number(e.target.value))};renderAt(0);
</script></html>
