services:
  plantillas-vite:
    build:
      context: ../cyberpulse-templates
    expose:
      - "5173"
    networks:
      - cyberpulse_net
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:5173/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  bot-python:
    build:
      context: .
    env_file:
      - .env  # Inyecta tus credenciales
    depends_on:
      plantillas-vite:
        condition: service_healthy
    environment:
      TEMPLATES_BASE_URL: http://plantillas-vite:5173
    volumes:
      - ./data:/bot/data
      - ./media:/bot/media
    networks:
      - cyberpulse_net
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true

networks:
  cyberpulse_net:
    driver: bridge
