version: 2
updates:
  - package-ecosystem: pip
    directory: /cyberpulse-bot
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /cyberpulse-templates
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /cyberpulse-bot
    schedule:
      interval: monthly
    open-pull-requests-limit: 3

  - package-ecosystem: docker
    directory: /cyberpulse-templates
    schedule:
      interval: monthly
    open-pull-requests-limit: 3

